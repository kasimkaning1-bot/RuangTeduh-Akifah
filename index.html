    function generateEmpatheticResponse(userText, userName, userAge, userGender, articleTheme = null) {

      const header = `Halo ${userName || 'Sahabat'}... `;
      
      if (articleTheme) {
        response += `Menyambung pembicaraan kita mengenai artikel *"${articleTheme}"* yang baru saja kamu baca. Terbuka sekali bagiku mendengar perspektif batinmu tentang topik ini. \n\n`;

        response += `Aku bisa merasakan betapa mendungnya batinmu saat ini. Menangis atau merasa sedih bukanlah tanda kamu lemah, melainkan tanda bahwa kamu adalah manusia seutuhnya yang memiliki hati yang lembut.\n\nTaruh tanganmu di dadamu, rasakan detak jantungmu, lalu hembuskan napas perlahan. Ingat, perasaan ini bagaikan awan mendung—ia datang menyapa, namun ia pasti akan berlalu untuk membiarkan langit birumu kembali bersinar. Ceritakanlah padaku pelan-pelan apa yang membuat batinmu seberat ini, aku sedia mendengarmu. ❤️`;
      } 
      else if (txt.includes('cemas') || txt.includes('panik') || txt.includes('takut') || txt.includes('grogi') || txt.includes('khawatir')) {
        response += `Kecemasan itu seperti alarm batin yang berdenting terlalu keras. Sangat wajar jika dadamu terasa sesak atau pikiranmu berputar kencang.\n\nAyo gabung bersamaku melakukan relaksasi instan sejenak:\nHirup napas dari hidung dalam-dalam selama **4 detik**... Tahan **4 detik**... Hembuskan secara perlahan lewat mulut seperti mendesah lega selama **4 detik**.\n\nApakah kecemasanmu ini berhubungan dengan sekolah, masa depan, atau ada hubungan keluarga/pertemanan yang sedang merisaukanmu? Ambillah waktumu untuk bercerita. ✨`;

      else if (txt.includes('lelah') || txt.includes('capek') || txt.includes('bosan') || txt.includes('stres') || txt.includes('pusing')) {

      }
      else if (txt.includes('marah') || txt.includes('benci') || txt.includes('kesal') || txt.includes('emosi')) {
        response += `Kemarahan adalah emosi yang valid dan lumrah. Jangan ditekan kencang ya sahabat, ayo kita salurkan secara damai.\n\nCobalah remas bantal di dekatmu atau urai penyebab kekesalanmu lewat tulisan jurnal di sini. Apakah ada orang di sekitarmu yang merusak batasan dirimu atau memperlakukanmu secara kurang adil? Biarkan aku mendengarmu menguraikan rasa kesalmu secara bebas. 🕊️`;
      }
      else if (txt.includes('teman') || txt.includes('sahabat') || txt.includes('pacar') || txt.includes('relasi') || txt.includes('bully') || txt.includes('toxic')) {
        response += `Hubungan sosial di masa remaja memang terkadang penuh dinamika yang menguras emosi. Kadang kita merasa terasingkan atau bahkan sulit berkata "Tidak" karena takut dijauhi.\n\nIngatlah batasan yang sehat: relasi terbaik adalah relasi yang membuatmu merasa aman menceritakan kerapuhanmu, bukan yang menuntutmu mengorbankan ketenteraman jiwamu. Ceritakan padaku, situasi pertemanan seperti apa yang sedang membebani batinmu hari ini? ` + (userAge ? `Di usiamu yang ${userAge} tahun, ini adalah masa yang sangat melatih ketajaman emosi.` : ``);
      }
      else if (txt.includes('keluarga') || txt.includes('ortu') || txt.includes('orang tua') || txt.includes('ayah') || txt.includes('ibu') || txt.includes('rumah')) {
        response += `Rumah dan keluarga terkadang bisa menjadi tempat yang paling hangat, namun di saat lain juga bisa menimbulkan tekanan batin yang mendalam karena adanya perbedaan ekspektasi antar generasi.\n\nKetahuilah bahwa kamu tidak bisa mengontrol reaksi atau kata-kata orang tuamu, tetapi kamu selalu punya daya penuh untuk melindungi kedamaian batin dalam dirimu sendiri. Jika kamu merasa sesak di dalam rumah, mari keluarkan pelan-pelan di sini. Aku akan selalu mendengarkan keluh kesahmu tanpa menghakimi. ❤️`;
      }
      else if (txt.includes('sekolah') || txt.includes('ujian') || txt.includes('tugas') || txt.includes('belajar') || txt.includes('bk') || txt.includes('nilai')) {
        response += `Tuntutan sekolah, tugas yang tak kunjung habis, atau ketakutan akan kegagalan nilai memang bisa memicu stres berkepanjangan pada remaja.\n\nIngat ya sahabat, selembar kertas hasil ujian tidak pernah mendefinisikan nilai dirimu yang seutuhnya. Kamu jauh lebih berharga daripada angka di atas rapor. Cobalah bagi belajarmu menjadi langkah-langkah kecil, dan jangan lupa selipkan jeda bernapas. Bagaimana detail kekhawatiran belajarmu saat ini? Moga-moga kita bisa cari jalan keluar bersama secara perlahan.`;

      }

      return header + response;
    }

    // ==========================================
    // --- COMPONENT: ONBOARDING PROFILE FORM ---

    function OnboardingModalTab({ onSave, onClose, isForce }) {
      const [name, setName] = useState('');
      const [age, setAge] = useState('');
      const [gender, setGender] = useState('Remaja Laki-laki');

      const submitProfile = (e) => {
        e.preventDefault();
        if (!name.trim()) return alert("Silakan beri tahu nama panggilanmu terhangat");
        if (!age || age < 10 || age > 25) return alert("Hanya ditujukan untuk batin remaja aktif (usia 10-25 tahun)");
        onSave(name.trim(), age, gender);
      };

      return (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50 animate-fade-in text-left">
          <div className="bg-white w-full max-w-md rounded-3xl overflow-hidden shadow-2xl border border-slate-100 flex flex-col">
            
            <div className="p-6 md:p-8 space-y-6">
              <div className="space-y-2 text-center">
                <div className="inline-flex items-center justify-center w-12 h-12 rounded-full h-12 w-12 bg-emerald-500/10 text-emerald-600 mb-2">
                  <Icon name="sparkles" className="w-6 h-6 text-emerald-600" />
                </div>
                <h3 className="font-display font-extrabold text-slate-900 text-xl tracking-tight">
                  Selamat Datang di Ruang Teduh
                </h3>
                <p className="text-xs text-slate-500 max-w-sm mx-auto leading-relaxed">
                  Halo Sahabat! Lengkapi profil singkatmu agar Akifah bisa memberikan tanggapan batin yang paling nyaman, mendalam, dan bersahabat untukmu.
                </p>
              </div>

              <form onSubmit={submitProfile} className="space-y-4">
                <div className="space-y-1.5">
                  <label className="text-xs font-bold text-slate-700 block">Nama Panggilan Hangat :</label>
                  <input 
                     type="text" 
                     placeholder="Contoh: Rian, Siti, Amanda" 
                     required 
                     value={name}
                     onChange={(e) => setName(e.target.value)}
                     maxLength={20}
                     className="w-full text-slate-800 bg-slate-50 text-xs md:text-sm border border-slate-200 rounded-xl p-3 outline-none focus:ring-1 focus:ring-emerald-500 transition-all font-semibold"
                  />
                </div>

                <div className="grid grid-cols-2 gap-4">
                  <div className="space-y-1.5">
                    <label className="text-xs font-bold text-slate-700 block">Usiamu Saat Ini (Thn) :</label>
                    <input 
                      type="number" 
                      placeholder="Contoh: 16" 
                      required 
                      min="10" 
                      max="25"
                      value={age}
                      onChange={(e) => setAge(e.target.value)}
                      className="w-full text-slate-800 bg-slate-50 text-xs md:text-sm border border-slate-200 rounded-xl p-3 outline-none focus:ring-1 focus:ring-emerald-500 transition-all font-mono font-bold"
                    />
                  </div>
                  <div className="space-y-1.5">
                    <label className="text-xs font-bold text-slate-700 block">Jenis Kelamin :</label>
                    <select 
                      value={gender}
                      onChange={(e) => setGender(e.target.value)}
                      className="w-full text-slate-800 bg-slate-50 text-xs md:text-sm border border-slate-200 rounded-xl p-3 outline-none focus:ring-1 focus:ring-emerald-500 transition-all font-semibold"
                    >
                      <option value="Remaja Laki-laki">Laki-laki</option>
                      <option value="Remaja Perempuan">Perempuan</option>
                    </select>
                  </div>
                </div>

                <div className="pt-4 flex items-center justify-end gap-3">
                  {!isForce && (
                    <button 
                      type="button" 
                      onClick={onClose}
                      className="px-4 py-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 text-xs font-bold text-slate-600 cursor-pointer"
                    >
                      Batal
                    </button>
                  )}
                  <button 
                    type="submit"
                    className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-5 py-3 rounded-xl flex items-center justify-center gap-1.5 shadow-md shadow-emerald-600/10 transition-all cursor-pointer"
                  >
                    <Icon name="smile" className="w-4 h-4 text-white" />
                    <span>Mulai Berteduh Batin</span>
                  </button>
                </div>
              </form>
            </div>

          </div>
        </div>
      );
    }

    // ==========================================
    // --- COMPONENT: CHAT COMPANION ROOM -------
    // ==========================================
    function ChatRoomTab({ currentArticleContext, onClearArticleContext, userName, userAge, userGender }) {
      const STARTERS = [
        "Aku merasa lelah akhir-akhir ini tanpa alasan yang jelas...",
        "Bagaimana cara membatasi overthinking saat malam hari?",
        "Aku sungkan menolak ajakan bermain teman padahal tugasku menumpuk.",
        "Bagaimana membina hubungan pertemanan yang saling menghargai?"
      ];

      const [messages, setMessages] = useState([
        {
          id: 'welcome',
          role: 'model',
          text: `Halo ${userName || 'Sahabatku'}! Selamat datang di Ruangan Curahan Batin aman kita. Di sini batinmu bebas meluapkan kepenatan, kebingungan, dan perasaan apa pun. Semua cerita di sini dijaga dalam rahasia batin hangat kita.\n\nApakah ada hal atau beban pikiran yang ingin kita urai bersama hari ini?`,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        }
      ]);
      const [input, setInput] = useState('');
      const [typing, setTyping] = useState(false);
      const feedEndRef = useRef(null);

      useEffect(() => {
        feedEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, typing]);

      const submitChat = (txt) => {
        if (!txt.trim() || typing) return;

        const userMsg = {
          id: 'msg_' + Date.now(),
          role: 'user',
          text: txt,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        setMessages(prev => [...prev, userMsg]);
        setInput('');
        setTyping(true);

        // Simulated empathetic response delay for premium counseling feel
        setTimeout(() => {
          const aiText = generateEmpatheticResponse(txt, userName, userAge, userGender, currentArticleContext);
          setMessages(prev => [...prev, {
            id: 'ai_' + Date.now(),
            role: 'model',
            text: aiText,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          }]);
          setTyping(false);
          // If the reply succeeded and article context exists, let's clear it
          if (currentArticleContext) {
            onClearArticleContext();
          }
        }, 1200);
      };

      return (
        <div className="bg-white rounded-3xl border border-slate-150 shadow-xs flex flex-col md:grid md:grid-cols-4 overflow-hidden min-h-[500px]">
          
          {/* Side Panel: Starter & Bio info */}
          <div className="p-5 bg-gradient-to-b from-slate-50 to-slate-100/50 border-r border-slate-100 flex flex-col justify-between gap-6 text-left">
            <div className="space-y-4">
              <div className="flex items-center gap-1 text-emerald-600 font-bold text-xs uppercase tracking-wider">
                <Icon name="sparkles" className="w-3.5 h-3.5" />
                <span>Petunjuk Konseling</span>
              </div>
              
              <div className="space-y-1">
                <h4 className="font-display font-extrabold text-[#111827] text-sm leading-snug">
                  Mulai Cerita Batinmu
                </h4>
                <p className="text-[11px] text-slate-500 leading-relaxed">
                  Gunakan pemantik cepat di bawah atau tuliskan secara bebas perasaamu—entah itu tentang sekolah, keluarga, atau cemas masa depan.
                </p>
              </div>

              {/* Starter Buttons */}
              <div className="space-y-2 pt-2">
                {STARTERS.map((starter, idx) => (
                  <button
                    key={idx}
                    onClick={() => submitChat(starter)}
                    className="w-full text-left bg-white hover:bg-emerald-50 border border-slate-200/60 hover:border-emerald-300 rounded-xl p-3 text-[11px] font-medium text-slate-600 hover:text-emerald-800 transition-all shadow-2xs cursor-pointer block leading-normal"
                  >
                    "{starter}"
                  </button>
                ))}
              </div>
            </div>

            {/* Context Notice info */}
            {currentArticleContext && (
              <div className="bg-amber-50 rounded-2xl p-3.5 border border-amber-200/60 relative space-y-1">
                <button 
                  onClick={onClearArticleContext}
                  className="absolute top-1.5 right-1.5 text-slate-400 hover:text-slate-600 text-xs"
                >
                  ✕
                </button>
                <p className="text-[10px] font-bold text-amber-800 uppercase tracking-wide">Konteks Diskusi Artikel</p>
                <p className="text-[10px] text-amber-700 font-semibold line-clamp-2 leading-relaxed">
                  "{currentArticleContext}"
                </p>
              </div>
            )}
          </div>

          {/* Chat Workspace content viewport */}
          <div className="md:col-span-3 h-[450px] md:h-[520px] flex flex-col bg-white">
            
            {/* Header top row */}
            <div className="border-b border-slate-100 py-3.5 px-5 flex items-center justify-between text-left">
              <div className="flex items-center gap-2">
                <div className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse" />
                <div>
                  <h4 className="font-bold text-slate-800 text-xs md:text-sm">Akifah - Juru Dengar Batin</h4>
                  <p className="text-[10px] text-slate-400">Aktif menyimak curahan jiwamu</p>
                </div>
              </div>

              {/* Reset action */}
              <button
                onClick={() => {
                  if(confirm("Apakah Anda ingin menyeka riwayat chat batin lama ini?")) {
                    setMessages([{
                      id: 'welcome',
                      role: 'model',
                      text: `Halo ${userName || 'Sahabatku'}! Saya sudah merapikan layar diskusi lama kita. Mari buka halaman baru batin yang tenang. Ada yang ingin kita diskusikan baru?`,
                      timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    }]);
                  }
                }}
                className="text-slate-400 hover:text-red-500 p-1.5 rounded-lg text-xs font-bold transition-colors flex items-center gap-1 cursor-pointer"
                title="Buka Lembaran Baru"
              >
                <Icon name="refresh-cw" className="w-3.5 h-3.5" />
                <span className="hidden sm:inline">Bersihkan</span>
              </button>
            </div>

            {/* Chat list messages overflow port */}
            <div className="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 bg-slate-50/30">
              {messages.map((m) => {
                const isModel = m.role === 'model';
                return (
                  <div 
                    key={m.id} 
                    className={`flex items-start gap-2.5 ${isModel ? 'justify-start' : 'justify-end'}`}
                  >
                    {isModel && (
                      <div className="w-7 h-7 rounded-xl bg-emerald-600 flex items-center justify-center shrink-0 shadow-sm animate-float">
                        <Icon name="heart" className="w-4 h-4 text-white" fill="white" />
                      </div>
                    )}

                    <div className="flex flex-col max-w-[85%] md:max-w-[75%] space-y-1">
                      <div className={`rounded-2xl px-4 py-3 text-xs md:text-sm border leading-relaxed text-left space-y-2 select-text ${
                        isModel 
                          ? 'bg-white text-slate-800 border-slate-150 rounded-tl-none shadow-3xs' 
                          : 'bg-emerald-600 text-white border-emerald-600 rounded-tr-none'
                      }`}>
                        {m.text.split('\n\n').map((para, pIdx) => (
                          <p key={pIdx}>
                            {para.split('\n').map((line, lIdx) => {
                              // basic markdown highlighting support for bolder counseling
                              let processed = line;
                              // Bold syntax "**"
                              const boldRegex = /\*\*(.*?)\*\*/g;
                              const matchBold = processed.match(boldRegex);
                              if (matchBold) {
                                return (
                                  <span key={lIdx} className="block">
                                    {processed.split('**').map((part, partIdx) => 
                                      partIdx % 2 === 1 ? <strong key={partIdx} className="font-extrabold">{part}</strong> : part
                                    )}
                                  </span>
                                );
                              }
                              return <span key={lIdx} className="block">{processed}</span>;
                            })}
                          </p>
                        ))}
                      </div>
                      <span className={`text-[9px] text-slate-400 font-mono font-bold ${isModel ? 'text-left' : 'text-right'}`}>
                        {m.timestamp}
                      </span>
                    </div>

                    {!isModel && (
                      <div className="w-7 h-7 rounded-xl bg-purple-600 flex items-center justify-center shrink-0 shadow-sm font-bold text-xs text-white">
                        {(userName || 'S')[0].toUpperCase()}
                      </div>
                    )}
                  </div>
                );
              })}

              {typing && (
                <div className="flex items-start gap-2.5 justify-start">
                  <div className="w-7 h-7 rounded-xl bg-emerald-600 flex items-center justify-center shrink-0 shadow-sm">
                    <Icon name="heart" className="w-4 h-4 text-white" fill="white" />
                  </div>
                  <div className="bg-white border border-slate-150 rounded-2xl rounded-tl-none px-4 py-3 flex items-center gap-1.5 shadow-3xs">
                    <div className="w-1.5 h-1.5 rounded-full bg-emerald-600 animate-bounce" style={{ animationDelay: '0s' }} />
                    <div className="w-1.5 h-1.5 rounded-full bg-emerald-600 animate-bounce" style={{ animationDelay: '0.2s' }} />
                    <div className="w-1.5 h-1.5 rounded-full bg-emerald-600 animate-bounce" style={{ animationDelay: '0.4s' }} />
                  </div>
                </div>
              )}

              <div ref={feedEndRef} />
            </div>

            {/* Bottom Form input panel bar */}
            <div className="border-t border-slate-100 p-4 bg-white whitespace-nowrap">
              <form 
                onSubmit={(e) => { 
                  e.preventDefault(); 
                  submitChat(input); 
                }}
                className="flex items-center gap-2"
              >
                <input 
                  type="text" 
                  value={input}
                  onChange={(e) => setInput(e.target.value)}
                  placeholder="Ceritakan perasaanmu atau rasa cemasmu hari ini..."

    // ==========================================
    // --- COMPONENT: CALCULATOR STRES (QUIZ) ---
    // ==========================================
    function StressCalculatorTab({ onSwitchToChat }) {
      const [currentQ, setCurrentQ] = useState(0);
      const [answers, setAnswers] = useState({});
      const [resultScore, setResultScore] = useState(null);

      const handleAnswer = (score) => {
        const nextAnswers = { ...answers, [currentQ]: score };
        setAnswers(nextAnswers);

        if (currentQ < QUIZ_QUESTIONS.length - 1) {
          setCurrentQ(currentQ + 1);
        } else {
          // Calculate total
          const total = Object.values(nextAnswers).reduce((acc, curr) => acc + curr, 0);
          setResultScore(total);
        }
      };

      const handleResetQuiz = () => {
        setCurrentQ(0);
        setAnswers({});
        setResultScore(null);
      };

      const getStressCategory = (score) => {
        if (score <= 4) return { label: 'Tingkat Stres Rendah (Normal)', css: 'bg-emerald-50 text-emerald-800 border-emerald-200', desc: 'Batinmu berada dalam kondisi yang stabil dan terkendali dengan baik. Teruskan aktivitas positifmu, sempatkan journaling, serta jangan ragu beristirahat jika badan terasa sedikit lelah.', emote: '🌿' };
        if (score <= 9) return { label: 'Tingkat Stres Sedang (Wajar)', css: 'bg-amber-50 text-amber-800 border-amber-200', desc: 'Ada beberapa tekanan eksternal (seperti tugas menumpuk atau kecemasan kecil) yang mulai mengusik ketenangan jiwamu. Gunakan teknik Box Breathing di Pojok Edukasi atau ceritakan keresahanmu pada Akifah agar tidak menjadi beban bertumpuk.', emote: '⛅' };
        return { label: 'Tingkat Stres Tinggi (Butuh Perhatian)', css: 'bg-red-50 text-red-800 border-red-200', desc: 'Batinmu sedang dalam kondisi yang bising, kewalahan, dan sangat butuh didengarkan. Segera letakkan aktivitas belajarmu sejenak. Kamu sangat dianjurkan untuk bercerita langsung ke WhatsApp pendamping (Akifah) atau psikolog profesional di alamat SOS.', emote: '🌩️' };
      };

      return (
        <div className="max-w-xl mx-auto text-left animate-fade-in">
          
          {resultScore !== null ? (
            <div className="bg-white border border-slate-150 rounded-3xl p-6 md:p-8 space-y-6 shadow-xs">
              
              <div className="space-y-2 text-center">
                <span className="text-4xl block mb-2">{getStressCategory(resultScore).emote}</span>
                <p className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Hasil Refleksi Diri</p>
                <h3 className="font-display font-extrabold text-[#111827] text-xl">
                  {getStressCategory(resultScore).label}
                </h3>
              </div>

              {/* Score panel box */}
              <div className="bg-slate-50 border border-slate-100 rounded-2xl p-5 text-center space-y-1">
                <div className="text-3xl font-bold font-mono text-emerald-600 font-black">
                  {resultScore} <span className="text-xs text-slate-400 font-semibold">/ 15</span>
                </div>
                <p className="text-[10px] text-slate-500 font-semibold">Total Poin Skor Kesejahteraan Batin</p>
              </div>

              <div className="text-xs md:text-sm text-slate-600 leading-relaxed text-center font-medium max-w-sm mx-auto">
                {getStressCategory(resultScore).desc}
              </div>

              {/* Results CTA footer action list */}
              <div className="pt-4 border-t border-slate-100 flex flex-col md:flex-row items-center justify-between gap-3 shrink-0">
                <button
                  onClick={handleResetQuiz}
                  className="w-full md:w-auto text-center px-4 py-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 text-xs font-bold text-slate-600 transition-all cursor-pointer"
                >
                  Ulangi Tes
                </button>

                <button
                  onClick={onSwitchToChat}
                  className="w-full md:w-auto bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-5 py-3 rounded-xl flex items-center justify-center gap-1.5 shadow-md shadow-emerald-600/10 transition-all cursor-pointer"
                >
                  <Icon name="heart" className="w-4 h-4 text-white" fill="white" />
                  <span>Curhat ke Akifah Sekarang</span>
                </button>
              </div>

            </div>
          ) : (
            <div className="bg-white border border-slate-150 rounded-3xl p-6 md:p-8 space-y-6 shadow-xs">
              
              {/* Question heading */}
              <div className="space-y-2">
                <div className="flex items-center justify-between text-xs font-bold text-emerald-600 uppercase">
                  <span>Kalkulator Tingkat Stres Remaja</span>
                  <span className="font-mono">{currentQ + 1} / {QUIZ_QUESTIONS.length}</span>
                </div>
                
                {/* Active progress bar */}
                <div className="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden">
                  <div 
                    className="bg-emerald-500 h-full transition-all duration-300"
                    style={{ width: `${((currentQ + 1) / QUIZ_QUESTIONS.length) * 100}%` }}
                  />
                </div>
              </div>

              {/* Core question */}
              <div className="space-y-4">
                <h4 className="font-display font-extrabold text-[#111827] text-base md:text-lg tracking-tight leading-snug">
                  {QUIZ_QUESTIONS[currentQ].text}
                </h4>

                <div className="space-y-2.5">
                  {QUIZ_QUESTIONS[currentQ].options.map((opt, oIdx) => (
                    <button
                      key={oIdx}
                      onClick={() => handleAnswer(opt.score)}
                      className="w-full text-left bg-slate-50 hover:bg-emerald-50 border border-slate-200/60 hover:border-emerald-300 rounded-2xl p-4 text-xs md:text-sm font-semibold text-slate-700 hover:text-emerald-950 transition-all cursor-pointer flex items-center gap-3 shadow-3xs"
                    >
                      <span className="w-6 h-6 rounded-lg bg-white border border-slate-200/60 font-bold font-mono text-xs text-slate-500 flex items-center justify-center shrink-0">
                        {String.fromCharCode(65 + oIdx)}
                      </span>
                      <span className="leading-relaxed">{opt.text}</span>
                    </button>
                  ))}
                </div>
              </div>

            </div>
          )}

        </div>
      );
    }

                    target="_blank"
                    rel="noopener noreferrer"
                    className="bg-red-50 hover:bg-red-100 text-red-700 font-black text-xs px-4 py-2 rounded-xl flex items-center gap-1.5 transition-all"
                  >
                    <Icon name="phone-call" className="w-3.5 h-3.5 text-red-700 fill-red-400" />
                    <span>{hot.phone}</span>
                  </a>
                </div>
              </div>
            ))}
          </div>

          <p className="text-[10px] text-slate-400 text-center select-text">
            Informasi di atas dihimpun secara tulus untuk media bantuan pertolongan pertama krisis mental remaja Indonesia.
          </p>

        </div>
      );
    }

    // ==========================================
    // --- COMPONENT: FEEDBACK & TESTIMONIALS ----
    // ==========================================
    function FeedbackTab({ feedbacksList, setFeedbacksList, ratingsCount, averageScore }) {
      const [rating, setRating] = useState(0);
      const [hoverRating, setHoverRating] = useState(0);
      const [comment, setComment] = useState('');
      const [isSubmitted, setIsSubmitted] = useState(false);

      useEffect(() => {
        const savedSubmitted = localStorage.getItem('sahabat_satisfied_submitted');
        if (savedSubmitted === 'true') {
          setIsSubmitted(true);
          const savedRating = localStorage.getItem('sahabat_satisfied_rating');
          const savedComment = localStorage.getItem('sahabat_satisfied_comment');
          if (savedRating) setRating(parseInt(savedRating, 10));
          if (savedComment) setComment(savedComment);
        }
      }, []);

      const handleSubmitFeed = (e) => {
        e.preventDefault();
        if (rating === 0) return alert("Silakan sentuh untuk memilih peringkat bintang (1-5)");

        const author = localStorage.getItem('sahabat_username') || 'Sahabat Teduh';
        
        const newFeedback = {
          id: 'f_new_' + Date.now(),
          rating: rating,
          comment: comment.trim(),
          createdAt: new Date().toISOString(),
          userName: author
        };

        const updatedList = [newFeedback, ...feedbacksList];
        setFeedbacksList(updatedList);

        localStorage.setItem('sahabat_satisfied_submitted', 'true');
        localStorage.setItem('sahabat_satisfied_rating', rating.toString());
        localStorage.setItem('sahabat_satisfied_comment', comment);
        setIsSubmitted(true);
      };

      const handleEditRating = () => {
        setIsSubmitted(false);
      };

      const formatDateIndo = (dateStr) => {
        try {
          const date = new Date(dateStr);
          return date.toLocaleDateString('id-ID', { 
            day: 'numeric', 
            month: 'long', 
            year: 'numeric' 
          });
        } catch {
          return 'Baru saja';
        }
      };

      return (
        <section className="bg-white border-t border-b border-slate-100 py-12 px-4 text-left">
          <div className="max-w-4xl mx-auto space-y-10">
            
            {/* Core Rating Box */}
            <div className="bg-slate-50/50 rounded-3xl border border-emerald-100/60 p-6 md:p-8">
              
              {/* Header Title Grid */}
              <div className="flex flex-col md:flex-row md:items-center justify-between gap-6 border-b border-slate-200/50 pb-6 mb-6">
                <div className="space-y-2 text-left">
                  <div className="flex items-center gap-1.5 text-emerald-600 text-xs font-bold uppercase tracking-wider">
                    <Icon name="star" className="w-4 h-4 fill-emerald-500 text-emerald-500 animate-pulse" />
                    <span>Evaluasi Kualitas Pendampingan</span>
                  </div>
                  <h3 className="font-display font-extrabold text-[#111827] text-lg md:text-xl">
                    Apakah Layanan Ini Membantu Anda?
                  </h3>
                  <p className="text-xs text-slate-500">
                    Penilaianmu melatih batin kecerdasan Akifah menjadi media bimbingan yang lebih ramah, empati, dan suportif bagi sahabat remaja.
                  </p>
                </div>

                {/* Score badge */}
                <div className="flex items-center gap-3 bg-emerald-500/10 text-emerald-950 border border-emerald-200/40 rounded-2xl p-3 shrink-0 self-start md:self-auto shadow-xs">
                  <div className="text-center font-mono font-bold text-xl text-emerald-700">
                    {averageScore} <span className="text-xs text-slate-400">/ 5</span>
                  </div>
                  <div className="text-left border-l border-emerald-300/30 pl-3">
                    <p className="text-[10px] text-emerald-800 font-bold uppercase tracking-wider">Kesejukan Batin</p>
                    <p className="text-[10px] text-slate-500 font-semibold">{ratingsCount} Ulasan Masuk</p>
                  </div>
                </div>
              </div>

              {/* Form submit/saved display state */}
              {isSubmitted ? (
                <div className="text-center py-6 space-y-4">
                  <div className="w-12 h-12 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center mx-auto border border-emerald-200">
                    <Icon name="heart" className="w-6 h-6 stroke-[3]" />
                  </div>
                  
                  <div className="space-y-1">
                    <h4 className="font-display font-bold text-slate-800 text-sm md:text-base">
                      Terima Kasih Atas Apresiasi Hangatmu!
                    </h4>
                    <p className="text-xs text-slate-500 max-w-md mx-auto leading-relaxed">
                      Penilaian bintang <strong className="text-emerald-700 font-bold">{rating} dari 5</strong> berhasil disimpan secara real-time. Ulasanmu selalu menjadi cahaya batin layanan kami.
                    </p>
                  </div>

                  {comment.trim() && (
                    <div className="max-w-md mx-auto bg-white border border-slate-100 rounded-2xl p-4 italic text-slate-600 text-xs text-left shadow-xs">
                      "{comment}"
                    </div>
                  )}

                  <div className="pt-2">
                    <button
                      onClick={handleEditRating}
                      className="inline-flex items-center gap-1.5 text-xs text-emerald-600 hover:text-emerald-700 font-bold transition-all underline cursor-pointer"
                    >
                      <Icon name="pen-tool" className="w-3.5 h-3.5" /> Ubah Penilaian Anda
                    </button>
                  </div>
                </div>
              ) : (
                <form onSubmit={handleSubmitFeed} className="space-y-6">
                  
                  {/* Rating selection stars */}
                  <div className="space-y-2 text-left">
                    <label className="text-xs font-bold text-slate-700 block">
                      1. Sentuh atau klik untuk memilih bintang perasaanmu (1 - 5) :
                    </label>

                    <div className="flex flex-wrap items-center justify-start gap-2.5 py-1.5">
                      <div className="flex items-center gap-1">
                        {[1, 2, 3, 4, 5].map((starValue) => {
                          const active = (hoverRating || rating) >= starValue;
                          return (
                            <button
                              key={starValue}
                              type="button"
                              onClick={() => setRating(starValue)}
                              onMouseEnter={() => setHoverRating(starValue)}
                              onMouseLeave={() => setHoverRating(0)}
                              className="p-1 hover:scale-110 transition-transform duration-150 cursor-pointer focus:outline-none"
                              title={`Bintang ${starValue}`}
                            >
                              <Icon 
                                name="star" 
                                className={`w-8 h-8 transition-colors ${
                                  active 
                                    ? 'fill-amber-400 text-amber-400' 
                                    : 'text-slate-200'
                                }`} 
                              />
                            </button>
                          );
                        })}
                      </div>

                      <span className="text-xs font-bold text-slate-700 ml-2 bg-slate-100 px-3 py-1 rounded-full">
                        {rating === 1 && '😢 Kurang Membantu'}
                        {rating === 2 && '😕 Cukup Membantu'}
                        {rating === 3 && '🙂 Lumayan Membantu'}
                        {rating === 4 && '😊 Sangat Membantu'}
                        {rating === 5 && '💖 Istimewa, Membantu Sekali!'}
                        {rating === 0 && 'Sentuh bintang di atas'}
                      </span>
                    </div>
                  </div>

                  {/* Suggestion text comment */}
                  <div className="space-y-2 text-left">
                    <label className="text-xs font-bold text-slate-700 block">
                      2. Bagikan ulasan singkat sahabat tentang Ruang Teduh (opsional) :
                    </label>
                    <textarea
                      value={comment}
                      onChange={(e) => setComment(e.target.value)}
                      placeholder="Contoh: Layanan curhat Akifah sangat mendengarkan, batin rasanya jauh lebih ringan apalagi habis meditasi box breathing..."
                      rows={3}
                      className="w-full bg-white text-slate-800 text-xs md:text-sm border border-slate-200 rounded-xl p-3.5 outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-300 text-left transition-all"
                    />
                  </div>

                  <div className="flex items-center justify-end">
                    <button
                      type="submit"
                      disabled={rating === 0}
                      className="bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-200 text-white disabled:text-slate-400 font-bold text-xs px-6 py-3 rounded-xl flex items-center gap-1.5 shadow-md shadow-emerald-600/10 hover:scale-[1.01] transition-all cursor-pointer"
                    >
                      <Icon name="heart" className="w-3.5 h-3.5 text-white" />
                      <span>Kirim Ulasan Batin</span>
                    </button>
                  </div>

                </form>
              )}

            </div>

            {/* Testimonial Wall Grid lists */}
            <div className="space-y-4">
              <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                <div className="flex items-center gap-2">
                  <Icon name="smile" className="w-5 h-5 text-purple-600" />
                  <h4 className="font-display font-extrabold text-slate-800 text-base">
                    Dinding Curahan Hati Sahabat
                  </h4>
                </div>
                <span className="text-[10px] font-extrabold uppercase tracking-widest text-[#6B7280] bg-slate-100 px-2.5 py-1 rounded-full">
                  {ratingsCount} Testimoni Nyata
                </span>
              </div>

              <p className="text-xs text-slate-500 max-w-xl text-left leading-relaxed">
                Inilah ruang kejujuran batin dari ribuan remaja yang saling menguatkan dalam perjalanan pendampingan di Ruang Teduh.
              </p>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4 max-h-[500px] overflow-y-auto pr-1.5">
                {feedbacks.map((item) => (
                  <div 
                    key={item.id}
                    className="bg-white hover:bg-slate-50/40 border border-slate-100 rounded-2xl p-4 transition-all duration-200 flex flex-col justify-between gap-3 text-left shadow-2xs hover:shadow-xs"
                  >
                    <div className="space-y-2">
                      <div className="flex items-center justify-between gap-2">
                        <div className="flex items-center gap-2">
                          <div className="w-7 h-7 rounded-full bg-gradient-to-tr from-purple-100 to-emerald-100 text-[#111827] flex items-center justify-center font-bold text-xs uppercase shadow-3xs border border-white">
                            {(item.userName || 'S')[0]}
                          </div>
                          <span className="text-xs font-bold text-slate-700">
                            {item.userName || 'Sahabat Anonim'}
                          </span>
                        </div>

                        <div className="flex items-center gap-0.5 bg-amber-50 px-2 py-0.5 rounded-lg border border-amber-100/50">
                          <Icon name="star" className="w-3 h-3 fill-amber-400 text-amber-400" />
                          <span className="text-[10px] font-bold text-amber-800">{item.rating}</span>
                        </div>
                      </div>

                      <p className="text-xs text-slate-600 leading-relaxed italic font-medium">
                        "{item.comment || 'Membagikan penilaian bintang hangat untuk bimbingan ini!'}"
                      </p>
                    </div>

                    <div className="flex items-center justify-between text-[10px] text-slate-400 border-t border-slate-50/80 pt-2 shrink-0">
                      <span className="flex items-center gap-1">
                        <Icon name="sparkles" className="w-3 h-3 text-emerald-500" fill="currentColor" />
                        <span>Verifikasi Sahabat</span>
                      </span>
                      <span>{formatDateIndo(item.createdAt)}</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>

          </div>
        </section>
      );
    }

    // --- Boot and render React Applet DOM ---
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
